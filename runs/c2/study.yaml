{
  "study_id": "tajfel",
  "title": "Tajfel minimal group paradigm (c2: label hidden (Person A / Person B, group labels withheld))",
  "research_question": "Does mere social categorization produce ingroup favouritism in resource allocation, and does it depend on the category being salient / the group being a minority?",
  "hypothesis": "H1: with a visible label (c1) agents favour the ingroup (mean_favour > 0 on the parity matrix, and mif_favour_share > 0.5 -- they give up joint profit to keep the ingroup ahead). H2: hiding the label (c2) removes or shrinks the bias. H3: the rarity arm (c3) does not change the direction, only the size, of the bias.",
  "title_i18n": {},
  "research_question_i18n": {},
  "hypothesis_i18n": {},
